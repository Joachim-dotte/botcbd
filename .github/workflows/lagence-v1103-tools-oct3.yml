name: LAgence v1103 tools October 3
on:
  push:
    branches: ['build/lagence-v11-sdk-20261002']
    paths: ['.github/workflows/lagence-v1103-tools-oct3.yml']
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obtain official SDK and public test dependencies
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$MANAGER" --licenses >/dev/null || true
          "$MANAGER" --install 'platforms;android-37.0' 'build-tools;37.0.0'
          mkdir -p staging/platform staging/build-tools staging/bin staging/tarballs
          cp "$SDK/platforms/android-37.0/android.jar" "$SDK/platforms/android-37.0/source.properties" staging/platform/
          cp -a "$SDK/build-tools/37.0.0" staging/build-tools/
          npm pack --ignore-scripts --pack-destination staging/tarballs @telegraf/types@7.1.0 abort-controller@3.0.0 accepts@2.0.0 body-parser@2.3.0 buffer-alloc-unsafe@1.1.0 buffer-alloc@1.2.0 buffer-fill@1.0.0 bytes@3.1.2 call-bind-apply-helpers@1.0.2 call-bound@1.0.4 content-disposition@1.0.1 content-type@1.0.5 content-type@2.1.0 cookie-signature@1.2.2 cookie@0.7.2 debug@4.4.3 depd@2.0.0 dotenv@17.2.0 dunder-proto@1.0.1 ee-first@1.1.1 encodeurl@2.0.0 es-define-property@1.0.1 es-errors@1.3.0 es-object-atoms@1.1.2 escape-html@1.0.3 etag@1.8.1 event-target-shim@5.0.1 express@5.2.1 finalhandler@2.1.1 forwarded@0.2.0 fresh@2.0.0 function-bind@1.1.2 get-intrinsic@1.3.0 get-proto@1.0.1 gopd@1.2.0 has-symbols@1.1.0 hasown@2.0.4 http-errors@2.0.1 iconv-lite@0.7.2 inherits@2.0.4 ipaddr.js@1.9.1 is-promise@4.0.0 math-intrinsics@1.1.0 media-typer@1.1.0 merge-descriptors@2.0.0 mime-db@1.54.0 mime-types@3.0.2 mri@1.2.0 ms@2.1.3 negotiator@1.0.0 node-fetch@2.7.0 object-inspect@1.13.4 on-finished@2.4.1 once@1.4.0 p-timeout@4.1.0 parseurl@1.3.3 path-to-regexp@8.4.2 proxy-addr@2.0.7 qs@6.16.0 range-parser@1.2.1 raw-body@3.0.2 router@2.2.0 safe-compare@1.1.4 safer-buffer@2.1.2 sandwich-stream@2.0.2 send@1.2.1 serve-static@2.2.1 setprototypeof@1.2.0 side-channel-list@1.0.1 side-channel-map@1.0.1 side-channel-weakmap@1.0.2 side-channel@1.1.1 statuses@2.0.2 telegraf@4.16.3 toidentifier@1.0.1 tr46@0.0.3 type-is@2.1.0 unpipe@1.0.0 vary@1.1.2 webidl-conversions@3.0.1 whatwg-url@5.0.0 wrappy@1.0.2
          command -v age >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends age; }
          cp "$(command -v age)" "$(command -v age-keygen)" staging/bin/
          tar -czf toolchain.tar.gz -C staging .
      - name: Encrypt public tools for local transfer
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir export
          cat > public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAq2xewfFHSuMB+p30uPmZ
          c5y/mkq20Da8bNv/68a3zIxn2E5t91REPtsasrjsKkzbmydHuCgfScngFKhWsLp6
          TgplWSM5epGn6RCpZxLjJg9HGHjFg71spWnGaFKvh0137t1hCWQ7EP5dpYglFqTu
          MINK0aPSB1xPCyQggf/7xD1rtn71HhpRKeMocDCKArsmBTpAAnrC/5wbZgScdsal
          JrIsYV55lJ4xfXB01XzP9WpSqB3eewqpku8wyC4PKb2jUAbJNmpeAMz3AZH/6BxF
          pWi5X/fFt0FGi0epId4a/yNJFDGMggPvxf3ujD7+/KvRXSJgmdwGP/Q4JslSqjWb
          0QIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,hmac,secrets,subprocess
          secret=secrets.token_bytes(80)
          key,iv,mac_key=secret[:32],secret[32:48],secret[48:]
          Path('secret.bin').write_bytes(secret)
          subprocess.run(['openssl','enc','-aes-256-cbc','-K',key.hex(),'-iv',iv.hex(),'-in','toolchain.tar.gz','-out','export/toolchain.enc'],check=True)
          mac=hmac.new(mac_key,iv,hashlib.sha256)
          with open('export/toolchain.enc','rb') as f:
              for b in iter(lambda:f.read(1048576),b''): mac.update(b)
          Path('export/tag.txt').write_text(mac.hexdigest())
          subprocess.run(['openssl','pkeyutl','-encrypt','-pubin','-inkey','public.pem','-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256','-pkeyopt','rsa_mgf1_md:sha256','-in','secret.bin','-out','export/keys.enc'],check=True)
          Path('secret.bin').unlink()
          print('Only public tools downloaded. No application sources, user data or signing secrets uploaded.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LAgence-v1103-tools-oct3
          path: export/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
