name: LAgence v11 - encrypted Android toolchain
on:
  push:
    branches: ['build/lagence-v11-sdk-20261002']
    paths: ['.github/workflows/lagence-v11-sdk-export.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Retrieve official build and exact public test packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$MANAGER" --licenses >/dev/null || true
          "$MANAGER" --install 'platforms;android-37.0' 'build-tools;37.0.0'
          mkdir -p staging/platform staging/build-tools staging/bin staging/tarballs
          cp "$SDK/platforms/android-37.0/android.jar" "$SDK/platforms/android-37.0/source.properties" staging/platform/
          cp -a "$SDK/build-tools/37.0.0" staging/build-tools/
          npm pack --ignore-scripts --pack-destination staging/tarballs @telegraf/types@7.1.0 abort-controller@3.0.0 accepts@2.0.0 body-parser@2.3.0 content-type@2.1.0 buffer-alloc@1.2.0 buffer-alloc-unsafe@1.1.0 buffer-fill@1.0.0 bytes@3.1.2 call-bind-apply-helpers@1.0.2 call-bound@1.0.4 content-disposition@1.0.1 content-type@1.0.5 cookie@0.7.2 cookie-signature@1.2.2 debug@4.4.3 depd@2.0.0 dotenv@17.2.0 dunder-proto@1.0.1 ee-first@1.1.1 encodeurl@2.0.0 es-define-property@1.0.1 es-errors@1.3.0 es-object-atoms@1.1.2 escape-html@1.0.3 etag@1.8.1 event-target-shim@5.0.1 express@5.2.1 finalhandler@2.1.1 forwarded@0.2.0 fresh@2.0.0 function-bind@1.1.2 get-intrinsic@1.3.0 get-proto@1.0.1 gopd@1.2.0 has-symbols@1.1.0 hasown@2.0.4 http-errors@2.0.1 inherits@2.0.4 iconv-lite@0.7.2 ipaddr.js@1.9.1 is-promise@4.0.0 math-intrinsics@1.1.0 media-typer@1.1.0 merge-descriptors@2.0.0 mime-db@1.54.0 mime-types@3.0.2 mri@1.2.0 ms@2.1.3 negotiator@1.0.0 node-fetch@2.7.0 object-inspect@1.13.4 on-finished@2.4.1 once@1.4.0 p-timeout@4.1.0 parseurl@1.3.3 path-to-regexp@8.4.2 proxy-addr@2.0.7 qs@6.16.0 range-parser@1.2.1 raw-body@3.0.2 router@2.2.0 safe-compare@1.1.4 safer-buffer@2.1.2 sandwich-stream@2.0.2 send@1.2.1 serve-static@2.2.1 setprototypeof@1.2.0 side-channel@1.1.1 side-channel-list@1.0.1 side-channel-map@1.0.1 side-channel-weakmap@1.0.2 statuses@2.0.2 telegraf@4.16.3 toidentifier@1.0.1 tr46@0.0.3 type-is@2.1.0 unpipe@1.0.0 vary@1.1.2 webidl-conversions@3.0.1 whatwg-url@5.0.0 wrappy@1.0.2
          command -v age >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends age; }
          cp "$(command -v age)" "$(command -v age-keygen)" staging/bin/
          cat "$SDK/platforms/android-37.0/source.properties"
          tar -czf toolchain.tar.gz -C staging .
      - name: Encrypt public tooling for the local build environment
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p export
          cat > recipient-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAsR0ELP7wEbqZD4KgCxth
          BO2XQSjx7wbxl2KWOKrkcGH9p5v0+MvRVtZoRDbBIz4BRQSgSPUeb1+6uypII840
          h5NOmko++WK0a1FD22r6LMB/s9rDIo7Bqbi/2cTwpQGXPVFVbkrRrEcInEMG8bA5
          bNs+6cMoYUS3jUDdtl63hKuecHQNtIsxzI7OjxfitpLC3LXR1/h+qmi9D2Lnvh1N
          ttt76N3DdCGw3GjKddg1N6uTkAuyoGSceVzL6Aj/+4ULBCie5PrY8rCd6GEA4SKr
          Q+173cqoNzsfmJQNUDoThZEluaOmG72X5wWbSaXWUkf1J8wjo6J65cvlsvXV4LKL
          RcQ+OWdYG55lxCEQbLKpH/DykIUHCKP2wQ6q7fjv717Fb1NxWIxmkvKnICrknRTi
          HHCliM0OhLoFE4oF36hYKL0Hz8DV4tZmMvrOMtQWr8xpphFJ59YH5CxieQvlNl9A
          rgAyK5MfaYhbz7XzWSj5XaeRasTdWxfAQw1+FPFwP1vJAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,hmac,secrets,subprocess
          secret=secrets.token_bytes(80)
          key,iv,mac_key=secret[:32],secret[32:48],secret[48:]
          Path('transfer-key.bin').write_bytes(secret)
          subprocess.run(['openssl','enc','-aes-256-cbc','-K',key.hex(),'-iv',iv.hex(),'-in','toolchain.tar.gz','-out','export/toolchain.enc'],check=True)
          mac=hmac.new(mac_key,iv,hashlib.sha256)
          with open('export/toolchain.enc','rb') as f:
              for b in iter(lambda:f.read(1024*1024),b''):mac.update(b)
          Path('export/tag.txt').write_text(mac.hexdigest()+'\n')
          subprocess.run(['openssl','pkeyutl','-encrypt','-pubin','-inkey','recipient-public.pem','-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256','-pkeyopt','rsa_mgf1_md:sha256','-in','transfer-key.bin','-out','export/keys.enc'],check=True)
          Path('transfer-key.bin').unlink()
          print('Only official SDK and public npm tools; application source, signing keys and user data remain local.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LAgence-v1103-local-build-tools
          path: export/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
