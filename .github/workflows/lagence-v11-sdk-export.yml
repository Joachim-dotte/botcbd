name: LAgence v11 - encrypted Android toolchain
on:
  push:
    branches: ['build/lagence-v11-sdk-20261002']
    paths: ['.github/workflows/lagence-v11-sdk-export.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Retrieve official build and test tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$MANAGER" --licenses >/dev/null || true
          "$MANAGER" --install 'platforms;android-37.0' 'build-tools;37.0.0'
          mkdir -p staging/platform staging/build-tools staging/test-deps staging/bin staging/tarballs
          cp "$SDK/platforms/android-37.0/android.jar" "$SDK/platforms/android-37.0/source.properties" staging/platform/
          cp -a "$SDK/build-tools/37.0.0" staging/build-tools/
          npm install --prefix staging/test-deps --ignore-scripts --no-audit --no-fund express@5.2.1 dotenv@17.2.0 telegraf@4.16.3
          npm pack --ignore-scripts --pack-destination staging/tarballs content-disposition@1.0.1 iconv-lite@0.7.2 media-typer@1.1.0 negotiator@1.0.0 proxy-addr@2.0.7 range-parser@1.2.1
          command -v age >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends age; }
          cp "$(command -v age)" "$(command -v age-keygen)" staging/bin/
          cat "$SDK/platforms/android-37.0/source.properties"
          tar -czf toolchain.tar.gz -C staging .
      - name: Encrypt for the current local build environment
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p export
          cat > recipient-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAoGd1h1wiSO4mNVrlpNEE
          iPZDTsaw0QHLpmDPhzKh0Mv17/jjnVqAd+GXo4ijudzt8+hllC/i4m06R60oWt9p
          /SyYVPX+bB0Bf7ogb5B/ACVgKxCY5ZWLcwb2uLfL2TWTZ5f7vtf5d+HbuV6Pe8+J
          xIrRNAfZEe0LJUHkhiHgNxKBgV1J3RHr2A4tOaPw2NdLQrK263t2pJSF2WZxxVj5
          6Me53QWB51WiF4cuqVo9fWSyCxNdjPKZcF/F2QhhYVa6umexas4j+eTQNit2ozNZ
          Y1tlyEEEILtql3ZxYb5h3GLe9CXF1L9dV5zptJ3RQIHuCKrDVt5lsE99qnX511EG
          PBhI4sSOyjaOwQRmpXflr+V9+RPgjnR4jZwpVMM+4IA60vQVnVik+U+VkB2RxgaZ
          ZJ63PNBHPVZqRqavqQT3jQ8C5123VhVLJkcgcTZlrizE7zswmBL0x2j2Tt/NIoWl
          xzT3LmP2DPOkaoGjSUXcyxYCJZrKuLsNjgdcsHB7HuyhAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,hmac,secrets,subprocess
          secret=secrets.token_bytes(80)
          key,iv,mac_key=secret[:32],secret[32:48],secret[48:]
          Path('transfer-key.bin').write_bytes(secret)
          subprocess.run(['openssl','enc','-aes-256-cbc','-K',key.hex(),'-iv',iv.hex(),'-in','toolchain.tar.gz','-out','export/toolchain.enc'],check=True)
          mac=hmac.new(mac_key,iv,hashlib.sha256)
          with open('export/toolchain.enc','rb') as f:
              for b in iter(lambda:f.read(1024*1024),b''):mac.update(b)
          Path('export/tag.txt').write_text(mac.hexdigest()+'\n')
          subprocess.run(['openssl','pkeyutl','-encrypt','-pubin','-inkey','recipient-public.pem','-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256','-pkeyopt','rsa_mgf1_md:sha256','-in','transfer-key.bin','-out','export/keys.enc'],check=True)
          Path('transfer-key.bin').unlink()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LAgence-v11-auditfix-build-tools
          path: export/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
